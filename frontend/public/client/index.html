<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Area Client — Portal Pembayaran QRIS</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Area Client</h1>
      <nav><a href="/" style="color:#fff">← Beranda</a> <span id="badge"></span></nav>
    </header>
    <main>
      <section class="card">
        <h2>Ringkasan saya</h2>
        <pre id="out">Memeriksa sesi…</pre>
      </section>
    </main>
    <script type="module">
      // Guard rute /client/*: wajib login (backend menolak anon dengan 401).
      // T4 mengisi halaman ini dengan katalog, order, dan layanan.
      const me = await (await fetch("/api/auth/me")).json();
      if (!me.user) {
        document.querySelector("#out").textContent = "Belum login — kembali ke / untuk masuk.";
      } else {
        document.querySelector("#badge").textContent = `${me.user.email} (${me.user.role})`;
        const r = await (await fetch("/api/client/summary")).json();
        document.querySelector("#out").textContent = JSON.stringify(r, null, 2);
      }
    </script>
  </body>
</html>
